name = "expensive-store"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Replace YOUR_D1_DATABASE_ID after running: wrangler d1 create expensive_store_db
[[d1_databases]]
binding = "DB"
database_name = "expensive_store_db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Create bucket with: wrangler r2 bucket create expensive-store-images
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "expensive-store-images"

[vars]
ENVIRONMENT = "production"
